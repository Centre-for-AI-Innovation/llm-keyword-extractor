[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-keyword-generator"
version = "0.1.0"
description = "Lightweight, standalone LLM-based keyword extraction from text."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
mistral = ["mistralai>=1.0.0"]

[project.scripts]
keyword-extractor = "keyword_extractor.cli:main"

[tool.setuptools]
packages = ["keyword_extractor"]
